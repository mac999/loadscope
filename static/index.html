<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoadScope</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand">
    <span class="logo"></span>
    <h1>LoadScope</h1>
  </div>
  <div class="head-right">
    <div class="view-switch" role="group">
      <button type="button" data-view="explorer" class="active" data-i18n="view.explorer">Explorer</button>
      <button type="button" data-view="dashboard" data-i18n="view.dashboard">Dashboard</button>
    </div>
    <div class="lang-switch" role="group">
      <button type="button" data-lang="ko">한국어</button>
      <button type="button" data-lang="en" class="active">English</button>
    </div>
  </div>
</header>

<section class="toolbar">
  <div class="field grow">
    <label for="path" data-i18n="label.path">File path to analyze</label>
    <input id="path" type="text" spellcheck="false"
           placeholder="C:\Windows\System32\notepad.exe">
  </div>
  <button id="browse" type="button" class="ghost" data-i18n="action.browse">Browse</button>
  <div class="field">
    <label for="depth" data-i18n="label.depth">Depth</label>
    <input id="depth" type="number" min="1" max="16" value="4">
  </div>
  <button id="run" type="button" class="primary" data-i18n="action.analyze">Analyze</button>
</section>

<main id="workspace" class="workspace">
  <section class="pane tree-pane">
    <div class="pane-head">
      <span data-i18n="pane.tree">Dependency tree</span>
      <span id="tree-count" class="count"></span>
    </div>
    <div id="tree" class="pane-body"></div>
  </section>

  <div class="splitter vertical" data-split="tree"></div>

  <div class="right-column">
    <section class="pane">
      <div class="pane-head">
        <span data-i18n="pane.imports">Imports</span>
        <span id="imports-of" class="count"></span>
      </div>
      <div id="imports" class="pane-body"></div>
    </section>

    <div class="splitter horizontal" data-split="imports"></div>

    <section class="pane">
      <div class="pane-head">
        <span data-i18n="pane.exports">Exports</span>
        <span id="exports-of" class="count"></span>
      </div>
      <div id="exports" class="pane-body"></div>
    </section>
  </div>
</main>

<div class="splitter horizontal" data-split="modules"></div>

<section class="pane modules-pane">
  <div class="pane-head">
    <span data-i18n="pane.modules">Modules</span>
    <span id="modules-count" class="count"></span>
  </div>
  <div id="modules" class="pane-body"></div>
</section>

<section id="dashboard" class="dashboard hidden"></section>

<footer id="status" class="status" data-i18n="status.ready">Ready</footer>

<script src="/app.js"></script>
</body>
</html>
